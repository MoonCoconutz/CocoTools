schema_version = "1.0.0"

id = "CocoPies"
name = "CocoPies"
version = "1.10.4"
tagline = "Build custom pie menus from Blender's own Preferences panel"
maintainer = "MoonCoconutz"
type = "add-on"
website = "https://github.com/MoonCoconutz/CocoTools"

blender_version_min = "4.5.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 MoonCoconutz",
]

[permissions]
files = "Read/write preset JSON, run configured scripts, load icons"

[build]
paths_exclude_pattern = [
  "/.git/",
  "__pycache__/",
  ".*",
  "/icons/custom/",
]
